# Contract: docs/workflows/branch-policy.md
# Resolves per-branch governance for AlphaOrch generated pipelines.
#
# Centralised deliberately: coverage thresholds and lint strictness are
# AlphaOrch governance rules, so they must not be readable or editable inside
# customer repositories.
name: "Reusable: Branch Policy"

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        description: "Originating branch to evaluate"
      base-coverage-threshold:
        required: false
        type: number
        default: 80
        description: "Coverage floor on non-promoted branches"
    outputs:
      branch:
        value: ${{ jobs.resolve.outputs.branch }}
      coverage-threshold:
        value: ${{ jobs.resolve.outputs.coverage-threshold }}
      fail-on-warning:
        value: ${{ jobs.resolve.outputs.fail-on-warning }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.policy.outputs.branch }}
      coverage-threshold: ${{ steps.policy.outputs.coverage-threshold }}
      fail-on-warning: ${{ steps.policy.outputs.fail-on-warning }}
    steps:
      - name: Resolve branch policy
        id: policy
        env:
          BRANCH: ${{ inputs.branch }}
          BASE_COVERAGE: ${{ inputs.base-coverage-threshold }}
        run: |
          # Promoted branches (uat, main) raise the bar: +10 coverage capped at
          # 95, and lint warnings become fatal.
          if [ "$BRANCH" = "uat" ] || [ "$BRANCH" = "main" ]; then
            COVERAGE_THRESHOLD=$((BASE_COVERAGE + 10))
            if [ "$COVERAGE_THRESHOLD" -gt 95 ]; then COVERAGE_THRESHOLD=95; fi
            FAIL_ON_WARNING=true
          else
            COVERAGE_THRESHOLD="$BASE_COVERAGE"
            FAIL_ON_WARNING=false
          fi
          {
            echo "branch=$BRANCH"
            echo "coverage-threshold=$COVERAGE_THRESHOLD"
            echo "fail-on-warning=$FAIL_ON_WARNING"
          } >> "$GITHUB_OUTPUT"
          echo "Branch policy resolved for $BRANCH (coverage >= $COVERAGE_THRESHOLD)"
