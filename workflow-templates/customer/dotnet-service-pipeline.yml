# Granular backend .NET workflow.
# Copy to .github/workflows/backend-ci.yml in a consumer repository.

name: "Backend CI"

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name for display and artifacts"
        required: true
        type: string
        default: "backend"
      service_path:
        description: "Relative path to the .NET service"
        required: false
        type: string
        default: "."
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "10.0.x"
      solution_path:
        description: "Solution or project to build. Leave empty to let the SDK discover it."
        required: false
        type: string
        default: ""
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 80
      enforce_coverage:
        description: "Fail when coverage is below threshold or missing"
        required: false
        type: boolean
        default: true
      docker_image:
        description: "Optional image name. Leave empty to skip Docker build."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

jobs:
  unit-tests:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/dotnet-test.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      dotnet-version: ${{ inputs.dotnet_version || '10.0.x' }}
      solution-path: ${{ inputs.solution_path || '' }}
      coverage-threshold: ${{ inputs.coverage_threshold || 80 }}
      enforce-coverage: ${{ inputs.enforce_coverage != false }}

  # dotnet format is the .NET counterpart of lint-check.yml.
  lint:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/dotnet-format.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      dotnet-version: ${{ inputs.dotnet_version || '10.0.x' }}
      solution-path: ${{ inputs.solution_path || '' }}

  # The compiler is the type checker for .NET, so analysis fills the slot a
  # typecheck job fills for a Node service.
  analyze:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/dotnet-analyze.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      dotnet-version: ${{ inputs.dotnet_version || '10.0.x' }}
      solution-path: ${{ inputs.solution_path || '' }}

  security:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/dotnet-audit.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      dotnet-version: ${{ inputs.dotnet_version || '10.0.x' }}
      solution-path: ${{ inputs.solution_path || '' }}
      fail-on-severity: High

  docker:
    needs: [unit-tests, lint, analyze, security]
    if: ${{ inputs.docker_image != '' }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/docker-build.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      image-name: ${{ inputs.docker_image }}
      push-image: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      scan-vulnerabilities: true

  deploy-render:
    needs: [unit-tests, lint, analyze, security]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'uat' || github.ref_name == 'main') }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/render-deploy.yml@v1
    with:
      system-name: ${{ inputs.service_name || 'backend' }}
      environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'uat' && 'uat' || 'dev' }}
      branch: ${{ github.ref_name }}
    secrets: inherit
