# Granular frontend Next.js workflow.
# Copy to .github/workflows/frontend-ci.yml in a consumer repository.

name: "Frontend CI"

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name for display and artifacts"
        required: true
        type: string
        default: "frontend"
      service_path:
        description: "Relative path to the frontend service"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version"
        required: false
        type: number
        default: 24
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 80
      enforce_coverage:
        description: "Fail when coverage is below threshold or missing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  security-events: write


jobs:
  unit-tests:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/frontend-tests.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'frontend' }}
      node-version: ${{ inputs.node_version || 24 }}
      coverage-threshold: ${{ inputs.coverage_threshold || 80 }}
      enforce-coverage: ${{ inputs.enforce_coverage != false }}
      test-command: npm run test

  lint:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/lint-check.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'frontend' }}
      node-version: ${{ inputs.node_version || 24 }}
      lint-command: npm run lint

  security:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/security-scan.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'frontend' }}
      node-version: ${{ inputs.node_version || 24 }}
      fail-on-high: true

  build:
    needs: [unit-tests, lint, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.service_path || '.' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || 24 }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != '' && 'npm' || '' }}
          cache-dependency-path: "**/package-lock.json"
      - run: |
          # No lockfile yet on a freshly scaffolded project: fall back to npm install
          # (not reproducible, hence the warning) instead of failing on day one.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning::No package-lock.json, so dependencies were resolved with npm install and this run is not reproducible. Commit a lockfile."
            npm install --no-audit --no-fund --ignore-scripts
          fi
      - run: npm run build

  deploy-vercel:
    needs: [unit-tests, lint, security, build]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'uat' || github.ref_name == 'main') }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/vercel-deploy.yml@v1
    with:
      system-name: ${{ inputs.service_name || 'frontend' }}
      working-directory: ${{ inputs.service_path || '.' }}
      environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      checkout-ref: ${{ github.sha }}
      git-branch: ${{ github.ref_name }}
    secrets: inherit
