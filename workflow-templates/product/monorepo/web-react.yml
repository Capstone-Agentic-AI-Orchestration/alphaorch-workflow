# Alpha-hosted monorepo caller for the frontend app in apps/web/: the jobs of
# workflow-templates/product/fe-react.yml with web- job ids and apps/web as the default folder.
# Alpha writes this to .github/workflows/ci-web.yml in a monorepo it hosts. The prefixed job ids keep
# this app's required checks distinct from the other app's. Vercel deploys through its own GitHub app,
# so CI never deploys and needs no deploy secrets.
# Generated from fe-react.yml by scripts/generate-monorepo-callers.mjs. Do not edit by hand.

name: "Web CI"

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name for display and artifacts"
        required: true
        type: string
        default: "web"
      service_path:
        description: "Relative path to the frontend service"
        required: false
        type: string
        default: "apps/web"
      node_version:
        description: "Node.js version"
        required: false
        type: number
        default: 24
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 10
      enforce_coverage:
        description: "Fail when coverage is below threshold or missing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  security-events: write


jobs:
  web-unit-tests:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/frontend-tests.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/web' }}
      system-name: ${{ inputs.service_name || 'web' }}
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}
      coverage-threshold: ${{ fromJSON(format('{0}', inputs.coverage_threshold || 10)) }}
      enforce-coverage: ${{ inputs.enforce_coverage != false }}

  web-lint:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/lint-check.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/web' }}
      system-name: ${{ inputs.service_name || 'web' }}
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}

  web-security:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/security-scan.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/web' }}
      system-name: ${{ inputs.service_name || 'web' }}
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}
      fail-on-high: true

  web-build:
    needs: [web-unit-tests, web-lint, web-security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.service_path || 'apps/web' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || 24 }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != '' && 'npm' || '' }}
          cache-dependency-path: "**/package-lock.json"
      - run: |
          # No lockfile yet on a freshly scaffolded project: fall back to npm install
          # (not reproducible, hence the warning) instead of failing on day one.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning::No package-lock.json, so dependencies were resolved with npm install and this run is not reproducible. Commit a lockfile."
            npm install --no-audit --no-fund --ignore-scripts
          fi
      - run: npm run build
