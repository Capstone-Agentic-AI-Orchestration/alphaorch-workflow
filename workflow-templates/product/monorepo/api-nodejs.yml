# Alpha-hosted monorepo caller for the backend app in apps/api/: the jobs of
# workflow-templates/product/be-nodejs.yml with api- job ids and apps/api as the default folder.
# Alpha writes this to .github/workflows/ci-api.yml in a monorepo it hosts. The prefixed job ids keep
# this app's required checks distinct from the other app's. Render deploys through its own GitHub app,
# so CI never deploys and needs no deploy secrets.
# Generated from be-nodejs.yml by scripts/generate-monorepo-callers.mjs. Do not edit by hand.

name: "API CI"

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name for display and artifacts"
        required: true
        type: string
        default: "api"
      service_path:
        description: "Relative path to the backend service"
        required: false
        type: string
        default: "apps/api"
      node_version:
        description: "Node.js version"
        required: false
        type: number
        default: 24
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 10
      enforce_coverage:
        description: "Fail when coverage is below threshold or missing"
        required: false
        type: boolean
        default: true
      docker_image:
        description: "Optional image name. Leave empty to skip Docker build."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write


jobs:
  api-unit-tests:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/backend-tests.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/api' }}
      system-name: ${{ inputs.service_name || 'api' }}
      backend-stack: nodejs
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}
      coverage-threshold: ${{ fromJSON(format('{0}', inputs.coverage_threshold || 10)) }}
      enforce-coverage: ${{ inputs.enforce_coverage != false }}

  api-lint:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/lint-check.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/api' }}
      system-name: ${{ inputs.service_name || 'api' }}
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}

  api-security:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/security-scan.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/api' }}
      system-name: ${{ inputs.service_name || 'api' }}
      node-version: ${{ fromJSON(format('{0}', inputs.node_version || 24)) }}
      fail-on-high: true

  api-docker:
    needs: [api-unit-tests, api-lint, api-security]
    if: ${{ inputs.docker_image != '' }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/docker-build.yml@v1
    with:
      working-directory: ${{ inputs.service_path || 'apps/api' }}
      image-name: ${{ inputs.docker_image }}
      push-image: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      scan-vulnerabilities: true
